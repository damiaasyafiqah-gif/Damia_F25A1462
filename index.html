<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Integration Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f7fb;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 900px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        .calculator-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 768px) {
            .calculator-layout {
                grid-template-columns: 350px 1fr;
            }
        }
        .sidebar {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #495057;
        }
        input {
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #4dabf7;
        }
        .bounds-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .result-box {
            margin-top: 10px;
            padding: 15px;
            background: #e7f5ff;
            border-left: 5px solid #228be6;
            border-radius: 4px;
        }
        .result-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #1c7ed6;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .result-value {
            font-size: 1.4rem;
            font-weight: bold;
            color: #0b7285;
            word-break: break-all;
        }
        .graph-container {
            position: relative;
            min-height: 350px;
            background: #fff;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 10px;
        }
        .error {
            color: #fa5252;
            font-size: 0.85rem;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Definite Integral Calculator</h1>
    
    <div class="calculator-layout">
        <div class="sidebar">
            <div class="input-group">
                <label for="function-input">Function f(x)</label>
                <input type="text" id="function-input" value="x^2 - 2x" placeholder="e.g., x^2, sin(x), exp(x)">
                <div id="error-message" class="error">Invalid expression</div>
            </div>

            <div class="bounds-group">
                <div class="input-group">
                    <label for="bound-a">Lower Bound (a)</label>
                    <input type="number" id="bound-a" value="0" step="any">
                </div>
                <div class="input-group">
                    <label for="bound-b">Upper Bound (b)</label>
                    <input type="number" id="bound-b" value="3" step="any">
                </div>
            </div>

            <div class="result-box">
                <div class="result-title">Definite Integral Value</div>
                <div id="result-display" class="result-value">0</div>
            </div>
        </div>

        <div class="graph-container">
            <canvas id="graphCanvas"></canvas>
        </div>
    </div>
</div>

<script>
    // Initialize Chart.js
    const ctx = document.getElementById('graphCanvas').getContext('2d');
    let chart;

    // Grab DOM elements
    const functionInput = document.getElementById('function-input');
    const boundAInput = document.getElementById('bound-a');
    const boundBInput = document.getElementById('bound-b');
    const resultDisplay = document.getElementById('result-display');
    const errorMessage = document.getElementById('error-message');

    // Numerical integration using Simpson's Rule
    function simpsonsRule(f, a, b, n = 1000) {
        if (n % 2 !== 0) n++; // n must be even
        const h = (b - a) / n;
        let sum = f(a) + f(b);

        for (let i = 1; i < n; i++) {
            const x = a + i * h;
            sum += i % 2 === 0 ? 2 * f(x) : 4 * f(x);
        }
        return (h / 3) * sum;
    }

    // Safely evaluate math expression using math.js
    function getMathFunction(exprString) {
        try {
            const compiled = math.compile(exprString);
            // Test if it evaluates correctly with a dummy variable
            compiled.evaluate({ x: 1 });
            errorMessage.style.display = 'none';
            return (x) => compiled.evaluate({ x: x });
        } catch (e) {
            errorMessage.style.display = 'block';
            return null;
        }
    }

    function updateCalculator() {
        const expr = functionInput.value;
        const a = parseFloat(boundAInput.value);
        const b = parseFloat(boundBInput.value);

        if (isNaN(a) || !isFinite(a) || isNaN(b) || !isFinite(b)) return;

        const f = getMathFunction(expr);
        if (!f) return;

        // Calculate Integration Value
        const integralValue = simpsonsRule(f, a, b);
        // Format to handle scientific notation gracefully or fallback to 5 decimals
        resultDisplay.textContent = Math.abs(integralValue) < 1e-5 && integralValue !== 0 
            ? integralValue.toExponential(4) 
            : Number(integralValue.toFixed(5)).toString();

        // Dynamic Graph Range Calculation
        const padding = Math.max(Math.abs(b - a) * 0.5, 2);
        const minX = Math.min(a, b) - padding;
        const maxX = Math.max(a, b) + padding;
        const steps = 200;
        const stepSize = (maxX - minX) / steps;

        const backgroundData = [];
        const shadedData = [];

        for (let i = 0; i <= steps; i++) {
            const x = minX + i * stepSize;
            let y;
            try {
                y = f(x);
            } catch(e) {
                y = null;
            }

            if (typeof y === 'number' && isFinite(y)) {
                backgroundData.push({ x: x, y: y });
                
                // If within integration bounds, add to the shaded area data
                if (x >= Math.min(a, b) && x <= Math.max(a, b)) {
                    shadedData.push({ x: x, y: y });
                }
            }
        }

        // Add edge-anchors to bounding boxes to make shading go down perfectly to the X-axis (y=0)
        if (shadedData.length > 0) {
            shadedData.unshift({ x: shadedData[0].x, y: 0 });
            shadedData.push({ x: shadedData[shadedData.length - 1].x, y: 0 });
        }

        // Render or Update Chart
        if (chart) {
            chart.data.datasets[0].data = backgroundData;
            chart.data.datasets[1].data = shadedData;
            chart.update('none'); // silent update for smoothness
        } else {
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: [
                        {
                            label: 'f(x)',
                            data: backgroundData,
                            borderColor: '#228be6',
                            borderWidth: 2.5,
                            pointRadius: 0,
                            fill: false,
                            tension: 0.1
                        },
                        {
                            label: 'Area Under Curve',
                            data: shadedData,
                            backgroundColor: 'rgba(34, 139, 230, 0.25)',
                            borderColor: 'transparent',
                            pointRadius: 0,
                            fill: true,
                            tension: 0.1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            grid: { color: '#e9ecef' }
                        },
                        y: {
                            type: 'linear',
                            grid: { color: '#e9ecef' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    },
                    animation: false
                }
            });
        }
    }

    // Attach Event Listeners for real-time calculation
    functionInput.addEventListener('input', updateCalculator);
    boundAInput.addEventListener('input', updateCalculator);
    boundBInput.addEventListener('input', updateCalculator);

    // Initial Trigger
    updateCalculator();
</script>

</body>
</html>
